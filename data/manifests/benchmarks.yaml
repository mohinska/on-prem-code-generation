name: benchmarks
role: eval_only
forbidden_for_training: true    # enforced by the decontamination script
description: >
  Evaluation benchmarks for COBOL code generation, plus HumanEval-Python as a
  regression check for catastrophic forgetting. Kept under benchmarks/ (git
  submodules or pinned clones) and logged as W&B artifacts; never copied into
  any training artifact.

evaluation_protocol:
  metrics: [compile_rate, pass@1, pass@10]   # compile_rate = CSR in the COBOL-Coder paper (arXiv:2604.03986)
  compiler:
    name: GnuCOBOL
    version: "3.2.0"            # upstream release built in docker/eval-sandbox.Dockerfile (GPG-verified, sha256-pinned);
                                # every ExecResult.meta["cobc_version"] records it. COBOLEval targets 3.2.0; the
                                # COBOL-Coder paper used 2.0.0, note the difference in the report.
                                # 3.1.2 (Debian bookworm) passes only 29/46 CobolCodeBench reference solutions, 3.2.0 passes 38/46.
    runtime: "defaults (COB_LS_VALIDATE=true: writing invalid data to a LINE SEQUENTIAL file fails with status 71)"
    flags:                      # fixed per protocol, taken from the reference harnesses (sandbox_runner.py)
      coboleval: "-w -fformat=variable -x"
      cobolcodebench: "-x"
  sandbox: docker/eval-sandbox.Dockerfile     # Vast instances can't run Docker: build the same GnuCOBOL 3.2.0 natively there
                                              # (apt gives 3.1.2 on Debian bookworm / Ubuntu, which scores lower)
  modes:                        # every benchmark is run in both modes (CLAUDE.md)
    non_thinking:
      enable_thinking: false
      greedy:  {temperature: 0.0, n: 1}                 # pass@1, comparable with the paper
      sampled: {temperature: 0.7, top_p: 0.8, n: 20}    # pass@1 and pass@10 (unbiased estimator); TODO: confirm Qwen3.8 recommended values
      max_new_tokens: 4096      # a full COBOL program; eval/run.py logs the truncation rate per mode
    thinking:
      enable_thinking: true     # Qwen advises against greedy decoding in thinking mode
      sampled: {temperature: 0.6, top_p: 0.95, n: 20}   # pass@1 and pass@10; TODO: confirm Qwen3.8 recommended values
      max_new_tokens: 16384     # reasoning + program; must fit the server's --max-model-len. Raise it if
                                # the logged truncation rate is high (truncated answers count as failures)
  runs: 3                       # greedy: average of three runs, zero-shot (paper protocol)
  per_sample_logging: "W&B Table with prompt, generation, compile log, test result, mode"

benchmarks:
  - name: coboleval
    task: code_generation
    url: https://github.com/zorse-project/COBOLEval
    local_path: benchmarks/coboleval/
    size: "146 problems (HumanEval translated to COBOL)"
    n_tasks: 146
    revision: 0bb96c3114bb2bb28e221e9d6000614781f8609d   # = the submodule commit pinned in benchmarks/coboleval
    license: "MIT"
    setup: "git submodule update --init benchmarks/coboleval"
    fetch:
      source: submodule         # read from the checked-out submodule, not downloaded
      files:
        completion: {path: data/CobolEval.jsonl, sha256: b018d90bdc53b32c3c76b9a67462e3f572f894dd98f0f084fc779992c7d21264}
    test_protocol: >
      per test: cobc -w -fformat=variable -x caller solution, run, read <ENTRY>.TXT, parse by type
      (reference: scripts/evaluation.py). The reference harness ships with the run step commented out.
    role_in_project: "primary benchmark"
    wandb_artifact: benchmark-coboleval
    caveat: "derived from HumanEval (general algorithmic tasks, not enterprise COBOL)"

  - name: cobolcodebench
    task: code_generation
    url: https://huggingface.co/datasets/harshini-kumar/CobolCodeBench
    local_path: benchmarks/cobolcodebench/
    size: "46 problems (adapted from BigCodeBench-Hard)"
    n_tasks: 46
    revision: 9d02534b7d1aabcbac1a1ec21c5a5e80c50323a8
    license: apache-2.0
    fetch:
      source: huggingface
      repo: harshini-kumar/CobolCodeBench
      files:
        completion: {path: CobolCodeBench_Complete.jsonl, sha256: 3c0d36a1bb769ca7dea6b6402c282744f4ee326ebaa6fe482654fb32f9ac6457}
        instruct:   {path: CobolCodeBench_Instruct.jsonl, sha256: 52fc79067c3b739f4cb2be560a209c57293cc6db5f9f4c8916978f7b7d9b7e43}
    test_protocol: >
      cobc -x, write the input files, run, every expected output file must match exactly
      (reference: CobolCodeBench-Framework src/evaluator/compile_execute.py)
    role_in_project: "harder, enterprise-style tasks (financial computation, data processing, reports)"
    wandb_artifact: benchmark-cobolcodebench
    caveat: "very small; results are noisy (best model in the paper scored 4.35 Pass@1)"
    # Reference solutions that fail in our sandbox (GnuCOBOL 3.2.0, checked 2026-10-15), so the ceiling is 38/46.
    # The sanity check expects exactly these to fail; report pass@1 over all 46 and over the 42 deterministic tasks.
    #   nondeterministic: the expected output was recorded from CURRENT-DATE / FUNCTION RANDOM, no program can match it
    #   broken_reference: the reference itself is wrong
    canonical_known_failures:
      task_func_17: {kind: broken_reference, why: "does not compile: subscripts WS-LINE, which is not a table (also on 3.1.2)"}
      task_func_20: {kind: broken_reference, why: "writes the expected file, then a TAB into a LINE SEQUENTIAL record -> status 71 (passes on 3.1.2, which has no LS validation)"}
      task_func_21: {kind: nondeterministic, why: "output contains CURRENT-DATE and FUNCTION RANDOM values"}
      task_func_23: {kind: nondeterministic, why: "dates from CURRENT-DATE and prices from FUNCTION RANDOM"}
      task_func_47: {kind: broken_reference, why: "reference blanks accented letters, expected output transliterates them; no input encoding reproduces it"}
      task_func_48: {kind: nondeterministic, why: "scores generated with FUNCTION RANDOM"}
      task_func_49: {kind: nondeterministic, why: "records generated with FUNCTION RANDOM"}
      task_func_55: {kind: broken_reference, why: "writes the expected file, then WRITEs to a file opened INPUT -> status 48 (also on 3.1.2)"}

  - name: humaneval_python
    task: code_generation
    url: https://github.com/openai/human-eval   # official jsonl; stdlib-only fetch (the HF copy is parquet)
    local_path: benchmarks/humaneval_python/
    size: "164 problems"
    n_tasks: 164
    revision: 6d43fb980f9fee3c892a914eda09951f772ad10d
    license: "MIT"
    fetch:
      source: github
      repo: openai/human-eval
      files:
        completion: {path: data/HumanEval.jsonl.gz, sha256: b796127e635a67f93fb35c04f4cb03cf06f38c8072ee7cee8833d7bee06979ef}
    role_in_project: "regression check: base vs adapted must not drop noticeably (catastrophic forgetting)"
    wandb_artifact: benchmark-humaneval-python
    sandbox_note: "Python execution also runs in the sandbox (no network, resource limits)"

  - name: cobol_javatrans
    task: translation           # COBOL->Java and Java->COBOL
    in_scope: false             # CLAUDE.md covers code generation; enable only if translation is added
    size: "143 pairs with tests"
    url: https://github.com/COBOL-Coder/COBOL-Coder   # TODO: verify the URL and that it contains the benchmark files
    revision: null              # TODO: pin commit
    local_path: benchmarks/cobol_javatrans/
    license: null               # TODO

  - name: mainframebench_test
    task: knowledge_and_summarization
    in_scope: false             # secondary eval axis, not in CLAUDE.md; enable explicitly if reported
    reference: data/manifests/mainframe_instruct.yaml   # use the official test splits only
    local_path: null            # loaded from the raw manifest, not copied here

decontamination:
  script: src/onprem_codegen/data/decontaminate.py
  config: configs/data/decontam.yaml      # benchmarks checked, n-gram size, threshold
  checks:
    - "n-gram containment (after uppercasing and stripping comments) of every part of every task: prompt, canonical solution, caller programs, expected outputs"
  against: [clean-corpus, sft-dataset]
  when:
    - "clean stage: before building clean-corpus"
    - "sft stage: on every sft-dataset version"
  fail_on_overlap: true
  reason: "COBOLEval and COBOL-JavaTrans derive from HumanEval, COBOLCodeBench from BigCodeBench; synthetic generation from those tasks would leak."

wandb:
  log_as_artifact: true         # one artifact per benchmark (see wandb_artifact), pinned commit in metadata
  artifact_type: benchmark
  results_table: eval/results   # base vs adapted, per mode
