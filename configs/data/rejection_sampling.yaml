# Rejection sampling: task-pool -> model on A's vLLM server -> execute -> sft-dataset (passed only).
task_pool: task-pool:latest           # W&B artifact; --task-pool PATH overrides with a local jsonl
clean_corpus: clean-corpus:latest     # accepted CodeNet submissions (source=codenet_cobol) are added too; null = skip

server:
  base_url: http://localhost:8000/v1  # vLLM OpenAI API through the SSH tunnel; env VLLM_BASE_URL overrides
  model: base                         # served model name (serve-entrypoint.sh: "base" / "cobol")
  request_timeout_s: 600
generator_model: Qwen/Qwen3.8-27B     # recorded in meta.generator_model

sampling:                             # non-thinking, like the SFT data itself (CLAUDE.md)
  n: 16                               # samples per task
  temperature: 0.7                    # = benchmarks.yaml non_thinking.sampled
  top_p: 0.8
  max_tokens: 2048
max_score: null                       # generate only for AtCoder tasks up to this score; human rows still use every task; null = all
second_pass_max_score: 300            # --second-pass: n more samples for unsolved tasks up to this score
concurrency: 16                       # tasks in flight at once; n × 16 = 256 = --max-num-seqs (needs a large GPU)
# Appended to the request only, not to the sft-dataset prompt. Targets the top compile errors of the 20-task smoke.
generation_hints: >-
  Rules: write the section name exactly as WORKING-STORAGE SECTION.
  Start every data name with WS- because names like COUNT or NUMBERS are reserved words.
  Keep every line within columns 8-72.
  Do not use SELECT, FD or any files.
  Output must match the samples exactly, so print numbers without leading zeros, spaces or plus signs:
  MOVE them to a field like PIC Z(17)9 and DISPLAY FUNCTION TRIM(field).

execute:
  timeout_s: 10.0
keep:
  max_per_task: 4                     # distinct passing programs per task, so easy tasks don't dominate
  drop_hardcoded_output: true         # with 1-2 sample tests, DISPLAY of the expected number is a cheat
