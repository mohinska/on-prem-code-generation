# Comparison model, adapted: the sft-gemma4 LoRA on Gemma 4 31B, served as `cobol`, non-thinking, same protocol as
# the frozen baseline (tests/test_eval_configs.py).
#   python -m onprem_codegen.eval.run --config configs/eval/sft-gemma4.yaml --stage generate        # on the instance
#   python -m onprem_codegen.eval.run --config configs/eval/sft-gemma4.yaml --stage execute \
#       --generations eval-generations:sft-gemma4                                                   # locally, sandbox
run_name: sft-gemma4
model_name: google/gemma-4-31B-it
adapter: sft-gemma4-adapter:candidate

server:
  base_url: http://localhost:8000/v1
  model: cobol
  request_timeout_s: 14400
  concurrency: 8

benchmarks:
  coboleval: [completion]
  cobolcodebench: [completion, instruct]
  humaneval_python: [completion]
modes: [non_thinking]
decodings: [greedy, sampled]
seed: 1234

execute:
  timeout_s: 10.0
  workers: 4
ks: [1, 10]
out_dir: outputs/eval
