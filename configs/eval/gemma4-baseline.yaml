# Comparison model without adapter: Gemma 4 31B served as `base`, non-thinking, every benchmark.
# Same protocol as the frozen baseline (tests/test_eval_configs.py). Gemma has no frozen baseline, so this run covers
# every group the verdict reads, HumanEval-Python and CobolCodeBench instruct included.
#   python -m onprem_codegen.eval.run --config configs/eval/gemma4-baseline.yaml --stage generate        # on the instance
#   python -m onprem_codegen.eval.run --config configs/eval/gemma4-baseline.yaml --stage execute \
#       --generations eval-generations:gemma4-baseline                                                   # locally, sandbox
run_name: gemma4-baseline
model_name: google/gemma-4-31B-it
adapter: null

server:
  base_url: http://localhost:8000/v1
  model: base
  request_timeout_s: 14400
  concurrency: 8

benchmarks:
  coboleval: [completion]
  cobolcodebench: [completion, instruct]
  humaneval_python: [completion]
modes: [non_thinking]
decodings: [greedy, sampled]
seed: 1234

execute:
  timeout_s: 10.0
  workers: 4
ks: [1, 10]
out_dir: outputs/eval
