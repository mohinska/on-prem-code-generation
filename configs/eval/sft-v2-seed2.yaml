# Second training seed (43) of sft-v2: the sft-v2-seed2 LoRA, served as `cobol-seed2`. Same benchmarks and protocol as
# sft-v2.yaml, so both seeds are compared on everything (tests/test_eval_configs.py checks it).
#   python -m onprem_codegen.eval.run --config configs/eval/sft-v2-seed2.yaml --stage generate        # on the instance
#   python -m onprem_codegen.eval.run --config configs/eval/sft-v2-seed2.yaml --stage execute \
#       --generations eval-generations:sft-v2-seed2                                                   # locally, sandbox
run_name: sft-v2-seed2
model_name: Qwen/Qwen3.8-27B
adapter: sft-v2-seed2-adapter:candidate

server:
  base_url: http://localhost:8000/v1
  model: cobol-seed2
  request_timeout_s: 14400
  concurrency: 8

benchmarks:
  coboleval: [completion]
  cobolcodebench: [completion, instruct]
  humaneval_python: [completion]
modes: [non_thinking]
decodings: [greedy, sampled]
seed: 1234

execute:
  timeout_s: 10.0
  workers: 4
ks: [1, 10]
out_dir: outputs/eval
