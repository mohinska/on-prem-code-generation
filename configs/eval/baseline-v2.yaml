# Baseline re-measured after the prompt indentation fix (plan 1.1): the unmodified model, non-thinking, only the groups
# whose prompts changed (COBOLEval and CobolCodeBench completion). Protocol identical to the frozen baseline.yaml
# (tests/test_eval_configs.py checks it); differs only in run_name, modes and benchmarks.
#   python -m onprem_codegen.eval.run --config configs/eval/baseline-v2.yaml [--stage generate|execute|all]
run_name: baseline-v2
model_name: Qwen/Qwen3.8-27B
adapter: null

server:
  base_url: http://localhost:8000/v1
  model: base
  request_timeout_s: 14400
  concurrency: 8

benchmarks:
  coboleval: [completion]
  cobolcodebench: [completion]
modes: [non_thinking]
decodings: [greedy, sampled]
seed: 1234

execute:
  timeout_s: 10.0
  workers: 4
ks: [1, 10]
out_dir: outputs/eval
