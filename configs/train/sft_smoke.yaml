# Smoke-test SFT: proves the Vast setup end to end (load, train, W&B, checkpoint, resume).
# python -m onprem_codegen.train.sft

run_name: sft-smoke
seed: 42

model:
  name: Qwen/Qwen3.8-27B
  load_in_4bit: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Verified against transformers 5.17 Qwen3_5ForCausalLM.
  target_modules:
    - q_proj                 # gated attention (every 4th layer)
    - k_proj
    - v_proj
    - o_proj
    - in_proj_qkv            # Gated DeltaNet (other layers)
    - in_proj_z
    - in_proj_b
    - in_proj_a
    - out_proj
    - gate_proj              # MLP
    - up_proj
    - down_proj

data:
  # W&B artifact with a prompt/completion JSONL; upload with `wandb artifact put` (README, Vast.ai smoke test).
  artifact: sft-smoke-data:latest
  eval_fraction: 0.1          # share of tasks held out for eval/loss (rows without task_id: share of rows)

train:
  output_dir: checkpoints/${run_name}
  max_steps: 50               # > 0 overrides num_train_epochs
  num_train_epochs: 1
  save_steps: 20
  logging_steps: 1
  learning_rate: 2e-4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  max_length: 1024
  gradient_checkpointing: true
  # Resume from the latest local checkpoint, else from the W&B checkpoint artifact.
  resume: true
